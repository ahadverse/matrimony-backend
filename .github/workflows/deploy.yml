name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Formatting is enforced; the ~52 remaining @typescript-eslint/no-unsafe-*
      # errors are pre-existing `any`-typing debt, so eslint reports without
      # gating deploys. Build and tests below are the hard gates.
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true

      - run: npm run build

      - run: npm test

  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            npm ci --include=dev
            npm run build
            pm2 reload ${{ vars.PM2_APP_NAME }} --update-env || pm2 start dist/main.js --name ${{ vars.PM2_APP_NAME }}
            pm2 save
