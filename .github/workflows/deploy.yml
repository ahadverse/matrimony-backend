name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Formatting is enforced. Type-safety linting (~44 @typescript-eslint
      # no-unsafe-* errors on untyped API/query responses) is pre-existing debt
      # and is not run here — it was blocking deploys for issues with no runtime
      # effect. Run `npm run lint` locally to see it. Build and tests are the
      # hard gates.
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - run: npm run build

      - run: npm test

  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            npm ci --include=dev
            npm run build
            pm2 reload ${{ vars.PM2_APP_NAME }} --update-env || pm2 start dist/main.js --name ${{ vars.PM2_APP_NAME }}
            pm2 save
